# /etc/nginx/sites-available/pos
# Copiar con: sudo cp deploy/nginx.conf /etc/nginx/sites-available/pos
# Activar con: sudo ln -s /etc/nginx/sites-available/pos /etc/nginx/sites-enabled/pos
# Probar con:  sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;   # reemplaza _ con tu dominio si tienes uno

    # ── Frontend (archivos estáticos compilados por Vite) ──────────
    root /var/www/pos-frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;  # React Router SPA
    }

    # ── Backend API (proxy al Node.js) ─────────────────────────────
    location /api/ {
        proxy_pass         http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── WebSocket (para el panel de eventos en tiempo real) ────────
    location /ws {
        proxy_pass         http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
    }

    # Subir límite para imágenes de platos
    client_max_body_size 10M;
}
