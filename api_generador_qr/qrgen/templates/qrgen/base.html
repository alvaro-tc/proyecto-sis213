{% load static %}<!DOCTYPE html>
<html lang="es" class="h-full bg-stone-950">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{% block title %}Generador de QR{% endblock %} - Orquestador</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<style>
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .pill { display: inline-flex; align-items: center; gap: .375rem; padding: .15rem .55rem; border-radius: 9999px; font-size: .72rem; font-weight: 600; }
  .pill-creating { background: #422006; color: #fde68a; }
  .pill-pending  { background: #1e3a8a; color: #bfdbfe; }
  .pill-paid     { background: #14532d; color: #bbf7d0; }
  .pill-expired  { background: #3f3f46; color: #d4d4d8; }
  .pill-cancelled{ background: #3f3f46; color: #d4d4d8; }
  .pill-failed   { background: #7f1d1d; color: #fecaca; }
  .dot { width: .5rem; height: .5rem; border-radius: 9999px; display: inline-block; }
</style>
</head>
<body class="min-h-full text-stone-100">
<header class="border-b border-stone-800 bg-stone-900/80 backdrop-blur sticky top-0 z-10">
  <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between">
    <a href="{% url 'qrgen:dashboard' %}" class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-amber-500 grid place-items-center text-stone-900 font-bold">Q</div>
      <div>
        <div class="font-semibold leading-tight">Orquestador QR</div>
        <div class="text-xs text-stone-400 leading-tight">Mercantil + Ganadero (ZAS)</div>
      </div>
    </a>
    <nav class="flex items-center gap-1 text-sm">
      <a href="{% url 'qrgen:dashboard' %}" class="px-3 py-1.5 rounded-md hover:bg-stone-800 {% if request.resolver_match.url_name == 'dashboard' %}bg-stone-800{% endif %}">Panel</a>
      <a href="{% url 'qrgen:generate' %}" class="px-3 py-1.5 rounded-md hover:bg-stone-800 {% if request.resolver_match.url_name == 'generate' %}bg-stone-800{% endif %}">Generar QR</a>
      <a href="{% url 'qrgen:generate_batch' %}" class="px-3 py-1.5 rounded-md hover:bg-stone-800 {% if request.resolver_match.url_name == 'generate_batch' %}bg-stone-800{% endif %}">Varios QR</a>
      <a href="{% url 'qrgen:history' %}" class="px-3 py-1.5 rounded-md hover:bg-stone-800 {% if request.resolver_match.url_name == 'history' %}bg-stone-800{% endif %}">Historial</a>
      <a href="/django-admin/" class="px-3 py-1.5 rounded-md hover:bg-stone-800 text-stone-400" target="_blank">Admin Django</a>
    </nav>
  </div>
</header>
<main class="max-w-7xl mx-auto px-6 py-8">
  {% block content %}{% endblock %}
</main>
<footer class="max-w-7xl mx-auto px-6 py-6 text-xs text-stone-500">
  Orquestador de QR - failover automatico entre bancos definidos en .env
</footer>
</body>
</html>
